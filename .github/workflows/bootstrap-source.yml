name: Bootstrap source

on:
  push:
    paths:
      - 'vivatech-commerce-source.tar.gz.b64'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project source
        shell: bash
        run: |
          base64 -d vivatech-commerce-source.tar.gz.b64 > /tmp/vivatech-commerce-source.tar.gz
          tar -xzf /tmp/vivatech-commerce-source.tar.gz
          rm -f vivatech-commerce-source.tar.gz.b64
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit restored source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Vivatech Commerce Stage 15 source [skip ci]' || exit 0
          git push
