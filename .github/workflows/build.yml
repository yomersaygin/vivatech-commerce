name: Build verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://grlicywrvkyeowsmbtaz.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build_verification_placeholder_key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test cart business rules
        run: node --experimental-strip-types --test tests/cart.test.mjs
      - name: Build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          nohup npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/vivatech-next.log 2>&1 &
          echo $! > /tmp/vivatech-next.pid
      - name: Wait for production server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Production server is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vivatech-next.log || true
          echo "Local production server did not become ready"
          exit 1
      - name: Smoke test critical routes
        shell: bash
        run: |
          set -euo pipefail
          routes=("/" "/products" "/account" "/checkout" "/api/health")
          for route in "${routes[@]}"; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "http://127.0.0.1:3000$route")"
            echo "$route -> HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              cat /tmp/vivatech-next.log || true
              echo "Smoke test failed for $route"
              exit 1
            fi
          done
      - name: Verify health contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 http://127.0.0.1:3000/api/health)"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="ok"||x.service!=="vivatech-commerce"||!x.timestamp) process.exit(1); console.log("Health contract OK")' "$body"
      - name: Verify customer entry flow contracts
        shell: bash
        run: |
          set -euo pipefail
          account_src="src/app/account/page.tsx"
          checkout_src="src/app/checkout/page.tsx"
          products_html="$(curl -fsS --max-time 20 http://127.0.0.1:3000/products)"

          grep -q 'Giriş Yap' "$account_src"
          grep -q 'Üye Ol' "$account_src"
          grep -q 'Şifremi Unuttum' "$account_src"
          grep -q 'create_customer_order_with_stock_v3' "$checkout_src"
          grep -q 'Giriş Yap / Üye Ol' "$checkout_src"
          grep -q 'Kayıtlı Adreslerim' "$checkout_src"
          grep -q 'Yeni Adres' "$checkout_src"
          grep -q 'Siparişi Oluştur' "$checkout_src"
          printf '%s' "$products_html" | grep -qi 'ürün'
          echo "Customer entry flow contracts OK"
      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/vivatech-next.pid ]; then
            kill "$(cat /tmp/vivatech-next.pid)" || true
          fi
